[package]
name = "pampa-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
yaml-rust2 = "0.11.0"

[dependencies.pampa]
path = ".."

[[bin]]
name = "hello_fuzz"
path = "fuzz_targets/hello_fuzz.rs"
test = false
doc = false
bench = false

# Excluded from the root workspace; declare this as its own workspace so
# cargo does not traverse up into the parent monorepo workspace when this
# checkout is a git worktree inside the main repo tree (bd-cvk7jb11).
[workspace]
